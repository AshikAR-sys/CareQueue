<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track My Token · CareQueue</title>
  <meta name="description" content="Follow your CareQueue token live on your phone: the token being served, people ahead of you and your estimated wait.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body class="screen-track">
  <!-- Lucide icons (ISC licence), inlined as a sprite so the page needs no icon package. -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-map-pin" viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
  </svg>
  <div class="backdrop" aria-hidden="true">
    <div class="scene"></div>
    <div class="light light-cyan"></div>
    <div class="light light-blue"></div>
    <div class="light light-mint"></div>
  </div>

  <main class="track">
    <header class="track-head">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9"/><path d="M13 8h6v5h5v6h-5v5h-6v-5H8v-6h5z"/></svg></span>
        <span class="brand-name">CareQueue</span>
      </span>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true" lang="en">English</button>
        <button type="button" data-lang="ta" aria-pressed="false" lang="ta">தமிழ்</button>
      </div>
    </header>
    <p class="track-live" id="track-live">Connecting…</p>

    <section class="glass track-card" id="track-card" data-state="loading" aria-live="polite">
      <p class="label" id="track-title">Your token</p>
      <p class="track-number" id="track-number">···</p>
      <p class="track-dept" id="track-dept">&nbsp;</p>

      <p class="track-alert" id="track-alert" role="status" hidden>
        <svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg><span id="track-alert-text">Almost your turn</span>
      </p>

      <dl class="track-stats" id="track-stats">
        <div><dt id="label-serving">Now serving</dt><dd id="track-serving">–</dd></div>
        <div><dt><svg class="ic ic-sm" aria-hidden="true"><use href="#i-users"/></svg><span id="label-ahead">People ahead</span></dt><dd id="track-ahead">–</dd></div>
        <div class="wide"><dt><svg class="ic ic-sm" aria-hidden="true"><use href="#i-clock"/></svg><span id="label-wait">Estimated wait</span></dt><dd id="track-wait">–</dd></div>
      </dl>

      <p class="track-where" id="track-where" hidden><svg class="ic ic-sm" aria-hidden="true"><use href="#i-map-pin"/></svg><span></span></p>
    </section>

    <p class="track-foot" id="track-foot">Keep this page open: it updates by itself. No app or sign-in needed.</p>
  </main>

  <script src="js/data.js"></script>
  <script src="js/queue-core.js"></script>
  <script src="js/queue.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/track.js"></script>
</body>
</html>
