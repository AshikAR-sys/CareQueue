services:
  - type: web
    name: carequeue-demo
    runtime: python
    plan: free
    branch: refactor/organize-frontend-backend-database
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT "backend.app:create_app()"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CAREQUEUE_DB_PATH
        value: /tmp/carequeue.sqlite3
