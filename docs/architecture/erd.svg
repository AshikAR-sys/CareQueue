<text x="1526" y="527" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">Priya Sharma</text>
<text x="1192" y="557" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">age</text>
<text x="1526" y="557" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">0–120</text>
<text x="1192" y="587" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">gender</text>
<text x="1526" y="587" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">Male · Female · Other</text>
<text x="1192" y="617" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">phone</text>
<text x="1526" y="617" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">10 digits, starts 6–9</text>
<text x="1156" y="647" font-size="11.5" font-weight="800" fill="#0a7e9b" text-anchor="start">FK</text>
<text x="1192" y="647" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">doctor</text>
<text x="1526" y="647" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">→ DOCTOR.name, optional</text>
<text x="1156" y="675" font-size="12" font-weight="500" fill="#5b6b82" text-anchor="start">Source: inside each TOKEN (never sent to display)</text>
