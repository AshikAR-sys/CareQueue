<text x="636" y="170" font-size="17" font-weight="800" fill="#0a7e9b" text-anchor="start">tokens</text>
<text x="636" y="207" font-size="11.5" font-weight="800" fill="#8a5300" text-anchor="start">PK</text>
<text x="672" y="207" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">id</text>
<text x="1106" y="207" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">auto number</text>
<text x="636" y="237" font-size="11.5" font-weight="800" fill="#5b6b82" text-anchor="start">UK</text>
<text x="672" y="237" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">queue_date + number</text>
<text x="1106" y="237" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">G001, unique per day</text>
<text x="636" y="267" font-size="11.5" font-weight="800" fill="#5b6b82" text-anchor="start">UK</text>
<text x="672" y="267" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">queue_date + code + seq</text>
<text x="636" y="297" font-size="11.5" font-weight="800" fill="#0a7e9b" text-anchor="start">FK</text>
<text x="672" y="297" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">code</text>
<text x="1106" y="297" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">→ departments.code</text>
<text x="672" y="327" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">seq</text>
<text x="1106" y="327" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">1–999</text>
<text x="672" y="357" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">status</text>
<text x="1106" y="357" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">waiting · serving · done · missed</text>
<text x="672" y="387" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">counter</text>
<text x="1106" y="387" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">1–3, set when called (US-11)</text>
<text x="672" y="417" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">priority</text>
<text x="1106" y="417" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">senior · pregnant · emergency</text>
<text x="672" y="447" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">rating</text>
<text x="1106" y="447" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">1–5 stars after the visit</text>
<text x="672" y="477" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">patient_name</text>
<text x="1106" y="477" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">patient details:</text>
<text x="672" y="507" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">age · gender</text>
<text x="1106" y="507" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">0–120 · Male/Female/Other</text>
<text x="672" y="537" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">phone</text>
<text x="1106" y="537" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">10 digits, starts 6–9</text>
<text x="672" y="567" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">doctor</text>
<text x="1106" y="567" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">optional</text>
<text x="672" y="597" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">created_at</text>
<text x="1106" y="597" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">issued (ms)</text>
<text x="672" y="627" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">called_at</text>
<text x="1106" y="627" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">Call Next / Recall</text>
<text x="672" y="657" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">done_at</text>
<text x="1106" y="657" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">completed</text>
<text x="672" y="687" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">skipped_at</text>
<text x="1106" y="687" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">Skip</text>
<text x="636" y="717" font-size="11.5" font-weight="800" fill="#0a7e9b" text-anchor="start">FK</text>
<text x="672" y="717" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">linked_from</text>
<text x="1106" y="717" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">→ tokens.number (Billing)</text>
<text x="636" y="747" font-size="11.5" font-weight="800" fill="#0a7e9b" text-anchor="start">FK</text>
<text x="672" y="747" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">forwarded_to</text>
<text x="1106" y="747" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">→ tokens.number (Billing)</text>
<text x="636" y="775" font-size="12" font-weight="500" fill="#5b6b82" text-anchor="start">One row per token; names and phones never leave via public-state</text>
