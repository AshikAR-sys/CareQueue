<text x="76" y="770" font-size="17" font-weight="800" fill="#5b6b82" text-anchor="start">open_counters</text>
<text x="76" y="807" font-size="11.5" font-weight="800" fill="#8a5300" text-anchor="start">PK</text>
<text x="112" y="807" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">queue_date + code</text>
<text x="476" y="807" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">one row per queue per day</text>
<text x="76" y="837" font-size="11.5" font-weight="800" fill="#0a7e9b" text-anchor="start">FK</text>
<text x="112" y="837" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">code</text>
<text x="476" y="837" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">→ departments.code</text>
<text x="112" y="867" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">counters</text>
<text x="476" y="867" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">open counters, e.g. &quot;1,2&quot;</text>
<text x="76" y="895" font-size="12" font-weight="500" fill="#5b6b82" text-anchor="start">US-11: no row = Counter 1 open</text>
<rect x="620" y="140" width="500" height="646" rx="12" fill="#fff" stroke="#0a7e9b" stroke-width="1.6"/>
