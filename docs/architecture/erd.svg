<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b82"/></marker></defs>
<rect width="1600" height="1030" fill="#f7fafc"/>
<text x="50" y="56" font-size="30" font-weight="800" fill="#0b1b33" text-anchor="start">CareQueue: entity relationship diagram</text>
<text x="50" y="86" font-size="16" font-weight="400" fill="#33445e" text-anchor="start">Logical model of the data CareQueue stores today. There is no database: records live in app/data.js and the browser&#x27;s localStorage.</text>
<rect x="60" y="140" width="400" height="196" rx="12" fill="#fff" stroke="#1458e6" stroke-width="1.6"/>
<path d="M60,186 V152 a12,12 0 0 1 12,-12 H448 a12,12 0 0 1 12,12 V186 Z" fill="#e6efff"/>
