<text x="112" y="687" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">name</text>
<text x="446" y="687" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">Dr. Anjali Rao</text>
<text x="76" y="717" font-size="11.5" font-weight="800" fill="#0a7e9b" text-anchor="start">FK</text>
<text x="112" y="717" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">department_id</text>
<text x="446" y="717" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">→ DEPARTMENT.id</text>
<text x="76" y="745" font-size="12" font-weight="500" fill="#5b6b82" text-anchor="start">Source: app/data.js (names listed per department)</text>
<rect x="600" y="140" width="400" height="136" rx="12" fill="#fff" stroke="#1458e6" stroke-width="1.6"/>
<path d="M600,186 V152 a12,12 0 0 1 12,-12 H988 a12,12 0 0 1 12,12 V186 Z" fill="#e6efff"/>
<line x1="600" y1="186" x2="1000" y2="186" stroke="#1458e6" stroke-width="1.2"/>
<text x="616" y="170" font-size="17" font-weight="800" fill="#1458e6" text-anchor="start">QUEUE_DAY</text>
<text x="616" y="207" font-size="11.5" font-weight="800" fill="#8a5300" text-anchor="start">PK</text>
<text x="652" y="207" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">date</text>
<text x="986" y="207" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">YYYY-MM-DD, one per day</text>
<text x="652" y="237" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">counters</text>
<text x="986" y="237" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">last number per code</text>
<text x="616" y="265" font-size="12" font-weight="500" fill="#5b6b82" text-anchor="start">Source: localStorage carequeue-queue:&lt;date&gt;</text>
<rect x="600" y="430" width="400" height="346" rx="12" fill="#fff" stroke="#0a7e9b" stroke-width="1.6"/>
<path d="M600,476 V442 a12,12 0 0 1 12,-12 H988 a12,12 0 0 1 12,12 V476 Z" fill="#dff4f8"/>
<line x1="600" y1="476" x2="1000" y2="476" stroke="#0a7e9b" stroke-width="1.2"/>
<text x="616" y="460" font-size="17" font-weight="800" fill="#0a7e9b" text-anchor="start">TOKEN</text>
<text x="616" y="497" font-size="11.5" font-weight="800" fill="#8a5300" text-anchor="start">PK</text>
<text x="652" y="497" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">date + number</text>
<text x="986" y="497" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">G001, unique per day</text>
<text x="616" y="527" font-size="11.5" font-weight="800" fill="#0a7e9b" text-anchor="start">FK</text>
<text x="652" y="527" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">date</text>
<text x="986" y="527" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">→ QUEUE_DAY.date</text>
<text x="616" y="557" font-size="11.5" font-weight="800" fill="#0a7e9b" text-anchor="start">FK</text>
<text x="652" y="557" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">code</text>
<text x="986" y="557" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">→ DEPARTMENT.code</text>
<text x="652" y="587" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">seq</text>
<text x="986" y="587" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">1, 2, 3…</text>
<text x="652" y="617" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">status</text>
<text x="986" y="617" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">waiting · serving · done · missed</text>
<text x="652" y="647" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">createdAt</text>
<text x="986" y="647" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">issued time</text>
<text x="652" y="677" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">calledAt</text>
<text x="986" y="677" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">Call Next / Recall</text>
<text x="652" y="707" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">doneAt</text>
<text x="986" y="707" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">next call completes</text>
<text x="652" y="737" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">skippedAt</text>
<text x="986" y="737" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">Skip</text>
<text x="616" y="765" font-size="12" font-weight="500" fill="#5b6b82" text-anchor="start">Source: inside QUEUE_DAY.tokens</text>
