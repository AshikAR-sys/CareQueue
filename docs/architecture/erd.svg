<text x="1192" y="497" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">token</text>
<text x="1526" y="497" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">→ TOKEN (embedded)</text>
