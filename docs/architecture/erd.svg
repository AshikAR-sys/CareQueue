<text x="76" y="170" font-size="17" font-weight="800" fill="#1458e6" text-anchor="start">DEPARTMENT</text>
<text x="76" y="207" font-size="11.5" font-weight="800" fill="#8a5300" text-anchor="start">PK</text>
<text x="112" y="207" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">id</text>
<text x="446" y="207" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">gen, card, ortho…</text>
<text x="76" y="237" font-size="11.5" font-weight="800" fill="#5b6b82" text-anchor="start">UK</text>
<text x="112" y="237" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">code</text>
<text x="446" y="237" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">token letter: G, C, O…</text>
<text x="112" y="267" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">name</text>
<text x="446" y="267" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">General Medicine</text>
<text x="112" y="297" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">location</text>
<text x="446" y="297" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">Ground floor, Block A</text>
<text x="76" y="325" font-size="12" font-weight="500" fill="#5b6b82" text-anchor="start">Source: app/data.js (static sample data)</text>
