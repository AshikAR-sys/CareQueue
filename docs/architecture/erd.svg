<text x="1256" y="450" font-size="12.5" font-weight="400" fill="#33445e" text-anchor="start">PK primary key · UK unique · FK reference</text>
<text x="1256" y="470" font-size="12.5" font-weight="400" fill="#33445e" text-anchor="start">Bars = exactly one</text>
