<text x="1526" y="207" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">patient · receptionist · admin</text>
<text x="1192" y="237" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">name</text>
<text x="1526" y="237" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">patient or desk name</text>
<text x="1192" y="267" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">phone</text>
<text x="1526" y="267" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">patient only</text>
<text x="1192" y="297" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">timestamp</text>
<text x="1526" y="297" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">expires after 8 hours</text>
<text x="1156" y="325" font-size="12" font-weight="500" fill="#5b6b82" text-anchor="start">Source: localStorage carequeue-session</text>
