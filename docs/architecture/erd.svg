<path d="M60,186 V152 a12,12 0 0 1 12,-12 H478 a12,12 0 0 1 12,12 V186 Z" fill="#e6efff"/>
<line x1="60" y1="186" x2="490" y2="186" stroke="#1458e6" stroke-width="1.2"/>
<text x="76" y="170" font-size="17" font-weight="800" fill="#1458e6" text-anchor="start">departments</text>
<text x="76" y="207" font-size="11.5" font-weight="800" fill="#8a5300" text-anchor="start">PK</text>
<text x="112" y="207" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">id</text>
<text x="476" y="207" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">gen, card, ortho…</text>
<text x="76" y="237" font-size="11.5" font-weight="800" fill="#5b6b82" text-anchor="start">UK</text>
<text x="112" y="237" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">code</text>
<text x="476" y="237" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">token letter: G, C, B…</text>
<text x="112" y="267" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">name</text>
<text x="476" y="267" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">General Medicine</text>
<text x="112" y="297" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">location</text>
<text x="476" y="297" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">Ground floor, Block A</text>
<text x="112" y="327" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">doctors_json</text>
<text x="476" y="327" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">doctor names (JSON list)</text>
<text x="112" y="357" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">active</text>
<text x="476" y="357" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">1 = shown</text>
<text x="112" y="387" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">sort_order</text>
<text x="476" y="387" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">display order</text>
<text x="76" y="415" font-size="12" font-weight="500" fill="#5b6b82" text-anchor="start">Seeded by database/seed.sql</text>
<rect x="60" y="520" width="430" height="166" rx="12" fill="#fff" stroke="#5b6b82" stroke-width="1.6"/>
<path d="M60,566 V532 a12,12 0 0 1 12,-12 H478 a12,12 0 0 1 12,12 V566 Z" fill="#eef2f7"/>
<line x1="60" y1="566" x2="490" y2="566" stroke="#5b6b82" stroke-width="1.2"/>
<text x="76" y="550" font-size="17" font-weight="800" fill="#5b6b82" text-anchor="start">queue_counters</text>
<text x="76" y="587" font-size="11.5" font-weight="800" fill="#8a5300" text-anchor="start">PK</text>
<text x="112" y="587" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">queue_date + code</text>
<text x="476" y="587" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">one row per queue per day</text>
<text x="76" y="617" font-size="11.5" font-weight="800" fill="#0a7e9b" text-anchor="start">FK</text>
<text x="112" y="617" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">code</text>
<text x="476" y="617" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">→ departments.code</text>
<text x="112" y="647" font-size="14.5" font-weight="500" fill="#0b1b33" text-anchor="start">last_seq</text>
<text x="476" y="647" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="end">1–999, last number issued</text>
<text x="76" y="675" font-size="12" font-weight="500" fill="#5b6b82" text-anchor="start">Token numbering: restarts each day</text>
<rect x="60" y="740" width="430" height="166" rx="12" fill="#fff" stroke="#5b6b82" stroke-width="1.6"/>
<path d="M60,786 V752 a12,12 0 0 1 12,-12 H478 a12,12 0 0 1 12,12 V786 Z" fill="#eef2f7"/>
