<text x="1151.5" y="510" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Departments</text>
<text x="1151.5" y="531" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Codes, names, rooms</text>
<text x="1151.5" y="552" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Doctors per department</text>
<rect x="1350.1999999999998" y="454" width="200" height="140" rx="14" fill="#dff4f8" stroke="#a9dde8" stroke-width="1.5"/>
<text x="1368.1999999999998" y="484" font-size="17" font-weight="700" fill="#0a7e9b" text-anchor="start">vendor/qrcode.js</text>
<text x="1368.1999999999998" y="510" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">QR codes (MIT)</text>
<text x="1368.1999999999998" y="531" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">qrcode-generator 1.4.4</text>
<text x="1368.1999999999998" y="552" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Slip, print, PNG</text>
<text x="1368.1999999999998" y="573" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">+ screens.js helpers</text>
<line x1="800" y1="386" x2="800" y2="452" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#ah)"/><text x="812" y="426" font-size="12.5" font-weight="500" fill="#5b6b82" text-anchor="start">every page loads the modules it needs</text>
<text x="185" y="652" font-size="15" font-weight="700" fill="#5b6b82" text-anchor="start">Server  (backend/, Flask)</text>
<rect x="50" y="664" width="735" height="250" rx="14" fill="#fff" stroke="#b9cdf5" stroke-width="1.5"/>
<text x="68" y="694" font-size="17" font-weight="700" fill="#1458e6" text-anchor="start">app.py  ·  Flask API + static file server</text>
<text x="68" y="720" font-size="14" font-weight="600" fill="#33445e" text-anchor="start">POST /api/staff/sign-in    PIN checked here → signed staff pass (8 h)</text>
<text x="68" y="741" font-size="14" font-weight="600" fill="#33445e" text-anchor="start">GET  /api/queue/state       staff pass required (with patient details)</text>
<text x="68" y="762" font-size="14" font-weight="600" fill="#33445e" text-anchor="start">GET  /api/queue/public-state · /api/health · /api/departments  (open)</text>
<text x="68" y="783" font-size="14" font-weight="600" fill="#33445e" text-anchor="start">POST /api/tokens · /api/tokens/&lt;n&gt;/rating   patients (open)</text>
<text x="68" y="804" font-size="14" font-weight="600" fill="#33445e" text-anchor="start">POST call-next · skip · send-to · recall · counters   staff pass + {counter}</text>
<text x="68" y="825" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">POST /api/test/reset only when CAREQUEUE_TEST_MODE=1 (else 404)</text>
<text x="68" y="846" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">services/queue_service.py: validation, numbering, transitions</text>
<line x1="150" y1="594" x2="150" y2="662" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#ah)"/><text x="162" y="624" font-size="12.5" font-weight="500" fill="#5b6b82" text-anchor="start">HTTP + JSON (fetch)</text>
<rect x="815" y="664" width="735" height="250" rx="14" fill="#fff4dc" stroke="#ecd29a" stroke-width="1.5"/>
<text x="833" y="694" font-size="17" font-weight="700" fill="#8a5300" text-anchor="start">SQLite  (database/, via backend/db.py)</text>
<text x="833" y="720" font-size="14" font-weight="600" fill="#33445e" text-anchor="start">departments      7 seeded rows incl. Billing (seed.sql)</text>
<text x="833" y="741" font-size="14" font-weight="600" fill="#33445e" text-anchor="start">tokens           one row per token per day, patient details,</text>
<text x="833" y="762" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">                  status, times, counter, Billing links</text>
<text x="833" y="783" font-size="14" font-weight="600" fill="#33445e" text-anchor="start">queue_counters   last token number per queue per day</text>
<text x="833" y="804" font-size="14" font-weight="600" fill="#33445e" text-anchor="start">open_counters    service counters open per queue per day</text>
<text x="833" y="825" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">schema.sql: CHECK constraints, unique numbers, indexes</text>
<text x="833" y="846" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">upgrade_schema(): adds new columns to older database files</text>
<text x="833" y="867" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Local: database/carequeue.sqlite3 (not in Git)</text>
<line x1="785" y1="790" x2="813" y2="790" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="799" y="780" font-size="12" font-weight="600" fill="#5b6b82" text-anchor="middle">SQL</text>
<rect x="50" y="950" width="735" height="130" rx="14" fill="#fff" stroke="#c9d6e3" stroke-width="1.5"/>
<text x="68" y="980" font-size="17" font-weight="700" fill="#5b6b82" text-anchor="start">Browser localStorage  (each device, convenience only)</text>
<text x="68" y="1006" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">carequeue-session: who is signed in (role, name, time, staff pass)</text>
<text x="68" y="1027" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">carequeue-staff-dept, carequeue-staff-dept-counter-&lt;code&gt;:</text>
<text x="68" y="1048" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">the staff console&#x27;s department and &#x27;my counter&#x27;</text>
<rect x="815" y="950" width="735" height="130" rx="14" fill="#e2f6ef" stroke="#a8dcc5" stroke-width="1.5"/>
<text x="833" y="980" font-size="17" font-weight="700" fill="#0e7a4f" text-anchor="start">Hosting  (render.yaml, Render free web service)</text>
<text x="833" y="1006" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Build: pip install -r backend/requirements.txt (Flask, gunicorn)</text>
<text x="833" y="1027" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Start: gunicorn &#x27;backend.app:create_app()&#x27; · health: /api/health</text>
<text x="833" y="1048" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Deploys automatically on every push to main · SQLite in /tmp (wiped on redeploy)</text>
<rect x="50" y="1116" width="735" height="250" rx="14" fill="#fff" stroke="#c9d6e3" stroke-width="1.5"/>
<text x="68" y="1146" font-size="17" font-weight="700" fill="#0b1b33" text-anchor="start">Automated tests  (npm run test:all, GitHub Actions on every PR)</text>
<text x="68" y="1172" font-size="14" font-weight="600" fill="#33445e" text-anchor="start">node:test · 75 unit tests → queue-core, announce, i18n, alerts</text>
<text x="68" y="1193" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">EWT, counters, priority, Tamil, alerts, tracking, reports</text>
<text x="68" y="1214" font-size="14" font-weight="600" fill="#33445e" text-anchor="start">unittest · 28 API tests → Flask + SQLite</text>
<text x="68" y="1235" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">transitions, counters, staff pass, privacy, schema upgrade</text>
<text x="68" y="1256" font-size="14" font-weight="600" fill="#33445e" text-anchor="start">Playwright · 58 browser tests → all pages on a test database</text>
<text x="68" y="1277" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">display &lt; 2 s, no names in public views, sign-in guards,</text>
<text x="68" y="1298" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">QR link, voice text, two receptionists, phone layout</text>
<rect x="815" y="1116" width="735" height="250" rx="14" fill="#fff" stroke="#9aa9bd" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="833" y="1146" font-size="17" font-weight="700" fill="#5b6b82" text-anchor="start">Known limits  (hackathon prototype)</text>
<text x="833" y="1172" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">One shared demo PIN (1234 unless CAREQUEUE_STAFF_PIN is set):</text>
<text x="833" y="1193" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">no personal staff accounts, no limit on sign-in attempts.</text>
<text x="833" y="1214" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Pages poll every second (no server push); fine for one clinic.</text>
<text x="833" y="1235" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Departments live in both seed.sql and data.js (keep in step).</text>
<text x="833" y="1256" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Free hosting: SQLite in /tmp is reset on redeploy or restart.</text>
<text x="833" y="1277" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Reports cover today only.</text>
</svg>