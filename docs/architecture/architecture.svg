<text x="68.0" y="510" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">TokenQueue</text>
<text x="68.0" y="531" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Fetches state every 1 s</text>
<text x="68.0" y="552" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">POSTs queue actions</text>
<text x="68.0" y="573" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Staff: full · others: public</text>
<rect x="266.7" y="454" width="200" height="140" rx="14" fill="#dff4f8" stroke="#a9dde8" stroke-width="1.5"/>
