<text x="284.7" y="510" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">QueueCore (rules)</text>
<text x="284.7" y="531" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">EWT = R + N/C × AST</text>
<text x="284.7" y="552" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">counters · track · report</text>
<text x="284.7" y="573" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Same rules as server</text>
<rect x="483.4" y="454" width="200" height="140" rx="14" fill="#dff4f8" stroke="#a9dde8" stroke-width="1.5"/>
<text x="501.4" y="484" font-size="17" font-weight="700" fill="#0a7e9b" text-anchor="start">auth.js</text>
