<text x="501.4" y="531" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Session, 8-hour expiry</text>
<text x="501.4" y="552" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Keeps the staff pass</text>
<text x="501.4" y="573" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Page guard by role</text>
