<text x="718.0999999999999" y="531" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">Web Audio chime</text>
<text x="718.0999999999999" y="552" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">speechSynthesis en-IN</text>
<text x="718.0999999999999" y="573" font-size="14" font-weight="400" fill="#33445e" text-anchor="start">“…counter 2.”</text>
